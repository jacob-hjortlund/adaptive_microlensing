
[project]
name = "adaptive_microlensing"
description = "Adaptive banks of microlensing magnitude maps that can be built, queried and updated."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "Jacob Osman Hjortlund", email = "jacob.hjortlund@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
]
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "adaptive>=1.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
]

[project.urls]
"Source Code" = "https://github.com/my-organization/adaptive_microlensing"

# On a mac, install optional dependencies with `pip install '.[dev]'` (include the single quotes)
[project.optional-dependencies]
ipm = [
    "microlensing>=0.1.7", # GPU map generation with IPM
]
plot = [
    "matplotlib>=3.8", # Figures of meshes, coverage, queries and builds
    "seaborn>=0.13", # Colourblind palettes and pair plots
]
dev = [
    "asv[virtualenv]==0.6.5", # Used to compute performance benchmarks
    "black", # Used for static linting of files
    "jupyter", # Clears output from Jupyter notebooks
    "matplotlib>=3.8", # Runs the plotting tests
    "mypy", # Used for static type checking of files
    "pre-commit", # Used to run checks before finalizing a git commit
    "pytest",
    "pytest-cov", # Used to report total code coverage
    "ruff", # Used for static linting of files
    "seaborn>=0.13", # Runs the plotting tests
]

[build-system]
requires = [
    "setuptools>=62", # Used to build and package the Python project
    "setuptools_scm>=6.2", # Gets release version from git. Makes it available programmatically
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "src/adaptive_microlensing/_version.py"

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "src",
    "docs",
]
addopts = "--doctest-modules --doctest-glob=*.rst"

[tool.black]
line-length = 110
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    "W",
    # Pyflakes
    "F",
    # pep8-naming
    "N",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # docstrings
    "D101",
    "D102",
    "D103",
    "D106",
    "D206",
    "D207",
    "D208",
    "D300",
    "D417",
    "D419",
    # Numpy v2.0 compatibility
    "NPY201",
]
ignore = [
    "UP006", # Allow non standard library generics in type hints
    "UP007", # Allow Union in type hints
    "SIM114", # Allow if with same arms
    "B028", # Allow default warning level
    "SIM117", # Allow nested with
    "UP015", # Allow redundant open parameters
    "UP028", # Allow yield in for loop
]

[tool.mypy]
# NumPy >= 2.5 ships stubs that use Python 3.12 syntax.
python_version = "3.12"
[tool.setuptools.package-data]
adaptive_microlensing = ["py.typed"]

[tool.coverage.run]
omit=["src/adaptive_microlensing/_version.py"]
